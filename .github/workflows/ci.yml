name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.11"
          enable-cache: true
      - uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - run: zig build setup
      - name: Check formatting
        run: |
          zig build format
          git diff --exit-code -- '*.mojo' build.zig
      - run: zig build test debug sanitize inspect
